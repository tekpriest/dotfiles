# cSpell:ignore shellcheck powerline pomicons
# shellcheck disable=SC1001,SC1012

# include themes/Catppuccin-Mocha.conf

font_family        DankMono Nerd Font Mono

font_size 9
disable_ligatures never
text_composition_strategy 1 1

# adjust_baseline 1
# adjust_line_height -2
# adjust_column_width 0

# window_padding_width 5
remember_window_size yes
# window_margin_width 0.2
# window_border_width 0.2

background_opacity 0.95
enable_audio_bell no
dynamic_background_opacity yes
draw_minimal_borders yes
cursor_blink_interval 0

macos_hide_from_tasks no
macos_quit_when_last_window_closed yes
macos_option_as_alt yes

# key mapping
kitty_mod super
map kitty_mod+enter new_window
map kitty_mod+n new_os_window_with_cwd

# mouse
mouse_hide_wait 1.0

# urls
detect_urls yes

#: Window
hide_window_decorations yes
confirm_os_window_close 0

enabled_layouts splits

# Tokyo Night color scheme for kitty terminal emulator
# https://github.com/davidmathers/tokyo-night-kitty-theme
#
# Based on Tokyo Night color theme for Visual Studio Code
# https://github.com/enkia/tokyo-night-vscode-theme

foreground #a9b1d6
background #1a1b26

Black
color0 #414868
color8 #414868

Red
color1 #f7768e
color9 #f7768e

Green
color2  #73daca
color10 #73daca

Yellow
color3  #e0af68
color11 #e0af68

Blue
color4  #7aa2f7
color12 #7aa2f7

Magenta
color5  #bb9af7
color13 #bb9af7

Cyan
color6  #7dcfff
color14 #7dcfff

White
color7  #c0caf5
color15 #c0caf5

Cursor
cursor #c0caf5
cursor_text_color #1a1b26

Selection highlight
selection_foreground none
selection_background #28344a

The color for highlighting URLs on mouse-over
url_color #9ece6a

Window borders
active_border_color #3d59a1
inactive_border_color #101014
bell_border_color #e0af68

Tab bar
tab_bar_style fade
tab_fade 1
active_tab_foreground   #3d59a1
active_tab_background   #16161e
active_tab_font_style   bold
inactive_tab_foreground #787c99
inactive_tab_background #16161e
inactive_tab_font_style bold
tab_bar_background #101014

Title bar
macos_titlebar_color #16161e
