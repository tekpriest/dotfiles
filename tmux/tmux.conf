#    ╚═╝   ╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═╝
# Terminal multiplexer
# https://github.com/tmux/tmux

source-file ~/.config/tmux/core.conf
source-file ~/.config/tmux/keys.conf
source-file ~/.config/tmux/statusbar.conf
source-file ~/.config/tmux/plugins.conf
# source-file ~/.config/tmux/themes/theme.conf
source-file ~/.config/tmux/themes/kanagawa.conf

# auto install tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run "$HOME/.tmux/plugins/tpm/tpm"
