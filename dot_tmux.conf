#!/bin/bash

# ████████╗███╗   ███╗██╗   ██╗██╗  ██╗
# ╚══██╔══╝████╗ ████║██║   ██║╚██╗██╔╝
#    ██║   ██╔████╔██║██║   ██║ ╚███╔╝
#    ██║   ██║╚██╔╝██║██║   ██║ ██╔██╗
#    ██║   ██║ ╚═╝ ██║╚██████╔╝██╔╝ ██╗
#    ╚═╝   ╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═╝
# Terminal multiplexer
# https://github.com/tmux/tmux

# base settings
# TODO: learn how this works
set-option -g focus-events on

# TODO: find a way to toggle this?
set-option -g display-time 3000

# colors
# set-option -sa terminal-features ",xterm-kitty:RGB"
set-option -sa terminal-features ",xterm-256color:RGB"

set -g base-index 1          # start indexing windows at 1 instead of 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay
set -g history-limit 1000000 # increase history size (from 2,000)
set -g mouse on              # enable mouse support
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g status-interval 3     # update the status bar every 3 seconds
set -g allow-passthrough on
set -g pane-base-index 1
set -g clock-mode-style 24
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-keys vi
setw -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"
set -g set-titles on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g default-terminal "${TERM}"
set -g message-command-style 'bg=default,fg=yellow'
set -g message-style 'bg=default,fg=yellow'
set -g mode-style 'bg=default,fg=yellow'
set -g pane-active-border-style 'fg=white,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# status bar
set -g status-position top
set -g status-left-length 200    # increase length (from 10)
set -g status-right-length 200   # increase length (from 10)
set -g status-left "#[fg=blue,bold]#S "
set -g status-right "#[fg=white,nobold]#(gitmux -cfg $HOME/.config/tmux/gitmux.yml) #[fg=yellow,bg=default]%d %b #[fg=white,bg=default]%H:%M "
set -g status-style 'bg=default'

# windows
set -g window-status-current-format '#[fg=magenta][ #W ]'
set -g window-status-format ' #[fg=gray]#W'

# vi mode
set-window-option -g mode-keys vi

# keymaps
# remap default prefix
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# splitting
unbind %
unbind '"'
bind | split-window -c '#{pane_current_path}' -h
bind - split-window -c '#{pane_current_path}' -v

# run commands
bind c new-window -c '#{pane_current_path}'
# bind g new-window -n ' ' lazygit
# bind G new-window -n ' ' gh dash
bind t new-window -n ' ' -c '#{pane_current_path}'

# panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key x kill-pane
bind-key X kill-window
bind-key q kill-session
bind-key Q kill-server

# resize panes with uppercase keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key x kill-pane
# TODO: until I understand what this is
# bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

# bind-key "s" display-popup -E -w 40% "sesh connect \"$(
#           sesh list -i | gum filter --limit 1 --placeholder 'Pick a session'
#           --height 50 --prompt='⚡'
# )\""

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# break pane into a window
bind = select-layout even-vertical
bind + select-layout even-horizontal
# bind - break-pane
bind _ join-pane

bind -N "⌘+g lazygit " g new-window -c "#{pane_current_path}" -n "" "lazygit 2> /dev/null"
# bind -N "⌘+G gh-dash " G new-window -c "#{pane_current_path}" -n "😺" "ghd 2> /dev/null"
bind -N "⌘+b build" b split-window -v -l 10 build
bind -N "⌘+d dev" D split-window -v -l 10 dev
bind -N "⌘+R run a script" Y split-window -v -l 10 "npm run $(jq -r '.scripts | keys[]' package.json | fzf --no-border)"
bind -N "⌘+Q kill current session" Q kill-session

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# open sessions all collapsed
# unbind w
# bind w -sw choose-tree

# reloading config
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# plugins config
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'

# tpm plugin
set -g @plugin "tmux-plugins/tpm"
set -g @plugin 'tmux-plugins/tmux-sensible'

# fzf
# set -g @plugin "joshmedeski/tmux-fzf-url"
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

# flot
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'o'
set -g @floax-change-path 'true'

# sessionx
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/tp/Code,/Users/tp/Code/personal,/Users/tp/Code/juice'
set -g @sessionx-bind 's'
set -g @sessionx-x-path '~/.dotfiles'
set -g @sessionx-window-height '65%'
set -g @sessionx-window-width '45%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'true'
# set -g @sessionx-filter-current 'false'
set -g @sessionx-window-mode 'off'

set -g @tmux-last-color on
set -g @tmux-last-pager 'less -r'
set -g @tmux-last-pager 'less'
set -g @tmux-last-prompt-pattern ' '
set -g @tmux-nerd-font-window-name-shell-icon ''
set -g @tmux-nerd-font-window-name-show-name false

set -g @plugin "joshmedeski/tmux-nerd-font-window-name"
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'thepante/tmux-git-autofetch'

# auto install tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# initialize tmux manager
run "$HOME/.tmux/plugins/tpm/tpm"
